            return 403;
        }

        # 파일 인젝션 차단
        if ($request_uri ~ "[a-zA-Z0-9_]=http://") {
            return 403;
        }

        if ($request_uri ~ "[a-zA-Z0-9_]=(\.\.//?)+") {
            return 403;
        }

        if ($request_uri ~ "[a-zA-Z0-9_]=/([a-z0-9_.]//?)+") {
            return 403;
        }

        # 일반적인 익스플로잇 차단
        if ($request_uri ~ "(<|%3C).*script.*(>|%3E)") {
            return 403;
        }
        if ($request_uri ~ "GLOBALS(=|\[|\%[0-9A-Z]{0,2})") {
            return 403;
        }

        if ($request_uri ~ "_REQUEST(=|\[|\%[0-9A-Z]{0,2})") {
            return 403;
        }

        if ($request_uri ~ "proc/self/environ") {
            return 403;
        }

        if ($request_uri ~ "mosConfig_[a-zA-Z_]{1,21}(=|\%3D)") {
            return 403;
        }

        if ($request_uri ~ "base64_(en|de)code\(.*\)") {
           return 403;
        }


        # HTTP 헤더 보안 강화
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # proxy_pass 설정
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

