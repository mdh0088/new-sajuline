# 볼륨 정의
volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  mssql_data:
    driver: local

# 네트워크 정의
networks:
  sajuline-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1