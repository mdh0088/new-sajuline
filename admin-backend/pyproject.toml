[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "sajuline-admin-backend"
version = "0.1.0"
description = "사주라인 관리자 백엔드 API 서버"
authors = [
    {name = "Sajuline Team", email = "dev@sajuline.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
keywords = ["fastapi", "sajuline", "admin", "management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # FastAPI 핵심 (backend와 동일 버전)
    "fastapi[all]==0.110.0",
    "uvicorn[standard]==0.27.1",
    "gunicorn==21.2.0",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    # 데이터베이스
    "sqlalchemy[asyncio]==2.0.28",
    "sqlmodel==0.0.16",
    "alembic==1.13.1",
    "aiomysql==0.2.0", # MariaDB/MySQL 비동기 드라이버
    "pymysql==1.1.0", # MariaDB/MySQL 동기 드라이버 (Alembic용)
    "pymssql==2.3.0", # MSSQL (2005 호환)
    # Redis (제거됨)
    # "redis[hiredis]==5.0.3",
    # "aioredis==2.0.1",
    # 인증 및 보안
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt>=3.2.0,<4.0.0",
    "python-multipart==0.0.9",
    "boto3==1.34.162",
    # "slowapi==0.1.9",  # 레이트 리미팅 (제거됨)
    # 외부 API 연동
    "httpx==0.27.0",
    "aiohttp==3.9.3",
    # 유틸리티
    "python-dateutil==2.9.0.post0",
    "email-validator==2.1.1",
    "phonenumbers==8.13.33",
    "pytz==2024.1",
    # 파일 처리
    "python-magic==0.4.27",
    "pillow==10.2.0",
    "openpyxl==3.1.2", # Excel 처리 (관리자용)
    "pandas==2.2.1", # 데이터 분석 (관리자용)
    # 로깅 및 모니터링
    "sentry-sdk[fastapi]==1.45.0",
    "python-json-logger==2.0.7",
    "loguru==0.7.2",
    # 환경 변수 및 설정
    "python-dotenv==1.0.1",
    # 검증 및 직렬화
    "marshmallow==3.21.1",
    "jsonschema==4.21.1",
]

[project.optional-dependencies]
dev = [
    # 테스트
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "pytest-cov==4.0.0",
    "httpx==0.27.0",  # 테스트 클라이언트

    # 코드 품질
    "black==24.3.0",
    "isort==5.13.2",
    "flake8==7.0.0",
    "mypy==1.9.0",
    "pre-commit==3.7.0",

    # 개발 도구
    "watchfiles==0.21.0",
    "ipython==8.22.2",
]

production = [
    # 프로덕션 전용 패키지
    "prometheus-client==0.20.0",
    "ddtrace==2.8.4",  # DataDog APM
]

[project.urls]
Homepage = "https://admin.sajuline.com"
Repository = "https://github.com/sajuline/sajuline-new"
Documentation = "https://docs.sajuline.com/admin"

[project.scripts]
admin-server = "src.main:main"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # 제외할 디렉터리
  \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
