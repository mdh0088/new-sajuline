# 사주라인 MVP 개발 환경 Docker Compose
# Frontend(Nuxt.js) + Backend(FastAPI) + PostgreSQL + Redis

services:
  # 프론트엔드 서비스 (Nuxt.js 3)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: sajuline-frontend
    ports:
      - "3000:3000"
    env_file:
      - ../frontend/.env.development
    environment:
      # Docker 환경에서 필요한 오버라이드
      - NODE_ENV=development
      - DOCKER_ENV=true
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sajuline-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 백엔드 서비스 (FastAPI)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: sajuline-backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env.development
    environment:
      # Docker 환경에서 필요한 오버라이드
      - DOCKER_ENV=true
      - DATABASE_URL=mysql+aiomysql://sajuline:sajuline123@mariadb:3306/sajuline?charset=utf8mb4
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://frontend:3000,http://localhost:3000,http://localhost:3001
      # HOST/PORT는 Docker 컨테이너용으로 오버라이드
      - HOST=0.0.0.0
      - PORT=8000
      # MSSQL(dev) 연결 설정
      - MSSQL_HOST=mssql-ars
      - MSSQL_PORT=1433
      - MSSQL_DB=ars
      - MSSQL_USER=sa
      - MSSQL_PASSWORD=Str0ng!Passw0rd
    volumes:
      - ../backend/src:/app/src
      - ../backend/logs:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sajuline-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL 데이터베이스
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: sajuline-postgres
  #   environment:
  #     POSTGRES_DB: sajuline
  #     POSTGRES_USER: sajuline
  #     POSTGRES_PASSWORD: sajuline123
  #     POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
  #     PGDATA: /var/lib/postgresql/data/pgdata
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ../database/sql:/docker-entrypoint-initdb.d:ro
  #   networks:
  #     - sajuline-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U sajuline -d sajuline"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 30s
  #   command: |
  #     postgres
  #     -c log_statement=all
  #     -c log_destination=stderr
  #     -c max_connections=200
  #     -c shared_buffers=256MB

  # Redis 캐시 서버
  redis:
    image: redis:7.2-alpine
    container_name: sajuline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    networks:
      - sajuline-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MariaDB 데이터베이스
  mariadb:
    image: mariadb:10.11
    container_name: sajuline-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sajuline
      MYSQL_USER: sajuline
      MYSQL_PASSWORD: sajuline123
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db-mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - sajuline-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --innodb-buffer-pool-size=256M

  # MSSQL 2019 (ARS) 데이터베이스
  mssql-ars:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql-ars
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Str0ng!Passw0rd"
      MSSQL_PID: Developer
      MSSQL_COLLATION: SQL_Latin1_General_CP1_CI_AS
      # 데이터베이스 정보 (참고용 - MSSQL은 초기화 스크립트로 생성)
      # 기본 master DB 접속: sa / Str0ng!Passw0rd
      # 생성할 DB: ars_db
      # 생성할 유저: ars_user / ars123
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./mssql/init:/init
    networks:
      - sajuline-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

  # MSSQL 초기화 일회성 서비스
  mssql-ars-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql-ars-init
    depends_on:
      mssql-ars:
        condition: service_healthy
    entrypoint: ["/bin/bash","-lc","SQLCMD=$$([ -x /opt/mssql-tools18/bin/sqlcmd ] && echo /opt/mssql-tools18/bin/sqlcmd || echo /opt/mssql-tools/bin/sqlcmd); $$SQLCMD -C -l 60 -S mssql-ars -U sa -P 'Str0ng!Passw0rd' -i /init/00_create_db.sql && $$SQLCMD -C -l 60 -S mssql-ars -U sa -P 'Str0ng!Passw0rd' -i /init/01_schema_tables.sql && $$SQLCMD -C -l 60 -S mssql-ars -U sa -P 'Str0ng!Passw0rd' -i /init/02_indexes.sql"]
    volumes:
      - ./mssql/init:/init:ro
    networks:
      - sajuline-network
    restart: "no"

# 볼륨 정의
volumes:
  # postgres_data:
  #   driver: local
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  mssql_data:
    driver: local

# 네트워크 정의
networks:
  sajuline-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1 