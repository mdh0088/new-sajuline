<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 사주라인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            background-color: #0a0a0f;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 헤더 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            height: 60px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
        }

        /* 메인 콘텐츠 */
        .main-content {
            margin-top: 60px;
            padding-bottom: 80px;
        }

        /* VIP 멤버십 카드 */
        .vip-card {
            margin: 20px;
            padding: 24px;
            background: linear-gradient(135deg, #7C3AED 0%, #9333EA 100%);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(147, 51, 234, 0.3);
        }

        .vip-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .vip-content {
            position: relative;
            z-index: 1;
        }

        .vip-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .vip-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(10, 10, 15, 0.5);
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .vip-badge-icon {
            font-size: 18px;
        }

        .vip-status {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 4px;
        }

        .settings-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .settings-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        .vip-info {
            margin-bottom: 24px;
        }

        .vip-welcome {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
        }

        .vip-benefits {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 4px;
        }

        .vip-points {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .points-info {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .points-value {
            font-size: 28px;
            font-weight: 800;
            color: #FFD700;
        }

        .points-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .benefits-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .benefits-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        /* 포인트 및 마일리지 섹션 */
        .stats-section {
            display: flex;
            gap: 12px;
            padding: 0 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            flex: 1;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .stat-card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.05);
        }

        .stat-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-button {
            font-size: 13px;
            color: #B794F6;
            font-weight: 600;
        }

        /* 마일리지 SHOP 배너 */
        .shop-banner {
            margin: 0 20px 24px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .shop-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
        }

        .shop-banner:active {
            transform: scale(0.98);
        }

        .shop-content {
            position: relative;
            z-index: 1;
        }

        .shop-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .shop-icon {
            font-size: 40px;
            opacity: 0.8;
        }

        .shop-arrow {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* 메뉴 섹션 */
        .menu-section {
            padding: 0 20px;
        }

        .menu-list {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-decoration: none;
            color: inherit;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .menu-title {
            font-size: 16px;
            font-weight: 500;
        }

        .menu-arrow {
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
        }

        /* 하단 메뉴 섹션 */
        .bottom-menu-section {
            padding: 20px;
            margin-top: 20px;
        }

        .bottom-menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bottom-menu-item:last-child {
            border-bottom: none;
        }

        .bottom-menu-item:active {
            opacity: 0.7;
        }

        .bottom-menu-title {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 하단 네비게이션 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #9333EA 0%, #B794F6 100%);
            transition: width 0.3s ease;
        }

        .nav-item.active {
            color: #B794F6;
        }

        .nav-item.active::before {
            width: 40px;
        }

        .nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        /* 채팅 버튼 */
        .chat-button {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
        }

        .chat-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
<!-- 헤더 -->
<header class="header">
    <div class="header-top">
        <h1 class="header-title">마이페이지</h1>
        <div class="header-actions">
            <button class="icon-btn" onclick="window.location.href='search-page.html'">🔍</button>
            <button class="icon-btn" onclick="window.location.href='login-page.html'">🔔</button>
        </div>
    </div>
</header>

<!-- 메인 콘텐츠 -->
<main class="main-content">
    <!-- VIP 멤버십 카드 -->
    <section class="vip-card">
        <div class="vip-content">
            <div class="vip-header">
                <div>
                    <div class="vip-badge">
                        <span class="vip-badge-icon">👑</span>
                        <span>VIP</span>
                    </div>
                    <div class="vip-status">적립 7%</div>
                </div>
                <button class="settings-btn">⚙️</button>
            </div>
            <div class="vip-info">
                <div class="vip-welcome">곧 새로운 멤버십 등급이 열립니다!</div>
                <div class="vip-benefits">더 많은 혜택이 경험하세요!</div>
            </div>
            <div class="vip-points">
                <div class="points-info">
                    <span class="points-value">0P</span>
                    <span class="points-label">/ 7,000,000P</span>
                </div>
                <button class="benefits-btn">혜택 보기</button>
            </div>
        </div>
    </section>

    <!-- 포인트 및 마일리지 섹션 -->
    <section class="stats-section">
        <a href="point.html" class="stat-card">
            <div class="stat-title">잔여 포인트</div>
            <div class="stat-value">0</div>
            <div class="stat-button">포인트 충전</div>
        </a>
        <a href="point_log.html" class="stat-card">
            <div class="stat-title">마일리지</div>
            <div class="stat-value" style="color: #FFD700;">0 M</div>
            <div class="stat-button">이월 적립 예정 0M</div>
        </a>
    </section>

    <!-- 마일리지 SHOP 배너 -->
    <a href="#" class="shop-banner">
        <div class="shop-content">
            <div class="shop-title">멤버십 마일리지 SHOP →</div>
        </div>
        <div class="shop-icon">🎁</div>
    </a>

    <!-- 메뉴 리스트 -->
    <section class="menu-section">
        <div class="menu-list">
            <a href="cs_log.html" class="menu-item">
                <span class="menu-title">상담 내역</span>
                <span class="menu-arrow">›</span>
            </a>
            <a href="favorite.html" class="menu-item">
                <span class="menu-title">충전 내역</span>
                <span class="menu-arrow">›</span>
            </a>
            <a href="point_log.html" class="menu-item">
                <span class="menu-title">마일리지 내역</span>
                <span class="menu-arrow">›</span>
            </a>
            <a href="review-page.html" class="menu-item">
                <span class="menu-title">관심 상담사</span>
                <span class="menu-arrow">›</span>
            </a>
            <a href="inquiry-list.html" class="menu-item">
                <span class="menu-title">상담후기</span>
                <span class="menu-arrow">›</span>
            </a>
        </div>
    </section>

    <!-- 하단 메뉴 -->
    <section class="bottom-menu-section">
        <a href="notice.html" class="bottom-menu-item">
            <span class="bottom-menu-title">공지사항</span>
            <span class="menu-arrow">›</span>
        </a>
        <a href="quick-cs-page.html" class="bottom-menu-item">
            <span class="bottom-menu-title">문의내역</span>
            <span class="menu-arrow">›</span>
        </a>
        <a href="#" class="bottom-menu-item">
            <span class="bottom-menu-title">로그아웃</span>
            <span class="menu-arrow">›</span>
        </a>
    </section>
</main>

<!-- 채팅 버튼 -->
<div class="chat-button">💬</div>

<!-- 하단 네비게이션 -->
<nav class="bottom-nav">
    <a href="main.html" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">홈</span>
    </a>
    <a href="event.html" class="nav-item">
        <span class="nav-icon">🎁</span>
        <span class="nav-label">이벤트</span>
    </a>
    <a href="chat_list.html" class="nav-item">
        <span class="nav-icon">💬</span>
        <span class="nav-label">빠른 상담</span>
    </a>
    <a href="favorite.html" class="nav-item">
        <span class="nav-icon">💳</span>
        <span class="nav-label">충전</span>
    </a>
    <a href="mypage-new.html" class="nav-item active">
        <span class="nav-icon">👤</span>
        <span class="nav-label">마이페이지</span>
    </a>
</nav>

<script>
    // 메뉴 아이템 클릭 효과
    document.querySelectorAll('.menu-item, .bottom-menu-item').forEach(item => {
        item.addEventListener('click', function() {
            this.style.background = 'rgba(255, 255, 255, 0.05)';
            setTimeout(() => {
                this.style.background = '';
            }, 200);
        });
    });

    // 로그아웃 기능
    document.querySelector('.bottom-menu-item:last-child').addEventListener('click', function(e) {
        e.preventDefault();
        if (confirm('로그아웃 하시겠습니까?')) {
            window.location.href = 'login-page.html';
        }
    });
</script>
</body>
</html>
