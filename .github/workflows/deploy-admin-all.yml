name: Deploy Admin All (Manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: '배포 대상'
        required: true
        default: 'all-prod'
        type: choice
        options:
          - all-prod
          - all-dev
          - admin-backend-prod
          - admin-backend-dev
          - admin-frontend-prod
          - admin-frontend-dev

jobs:
  # ========== Admin Backend Production ==========
  deploy-admin-backend-prod:
    if: ${{ github.event.inputs.target == 'all-prod' || github.event.inputs.target == 'admin-backend-prod' }}
    runs-on: [self-hosted, sajuline]
    steps:
      - name: Deploy Admin Backend (Production)
        run: |
          cd /data/www/new-sajuline/admin-backend
          git fetch origin
          git reset --hard origin/main
          chmod +x deploy.production.sh
          ./deploy.production.sh

      - name: Health Check
        run: |
          sleep 5
          curl -f http://localhost:8001/health || echo "Health check skipped"

  # ========== Admin Backend Development ==========
  deploy-admin-backend-dev:
    if: ${{ github.event.inputs.target == 'all-dev' || github.event.inputs.target == 'admin-backend-dev' }}
    runs-on: [self-hosted, sajuline]
    steps:
      - name: Deploy Admin Backend (Development)
        run: |
          cd /data/www/new-sajuline/admin-backend
          git fetch origin
          git reset --hard origin/main
          chmod +x deploy.development.sh
          ./deploy.development.sh

      - name: Health Check
        run: |
          sleep 5
          curl -f http://localhost:8001/health || echo "Health check skipped"

  # ========== Admin Frontend Build (Production) ==========
  build-admin-frontend-prod:
    if: ${{ github.event.inputs.target == 'all-prod' || github.event.inputs.target == 'admin-frontend-prod' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-front/package-lock.json

      - name: Cache Vite build
        uses: actions/cache@v4
        with:
          path: |
            admin-front/node_modules/.vite
            admin-front/node_modules/.cache
          key: vite-build-${{ runner.os }}-${{ hashFiles('admin-front/package-lock.json', 'admin-front/vite.config.ts') }}
          restore-keys: |
            vite-build-${{ runner.os }}-

      - name: Install dependencies
        working-directory: admin-front
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Vite (Production)
        working-directory: admin-front
        timeout-minutes: 10
        env:
          CI: true
          NODE_ENV: production
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build:prod

      - name: Verify build output
        working-directory: admin-front
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Build failed: dist/index.html not found"
            exit 1
          fi
          echo "Build verified successfully"
          ls -la dist/

      - name: Compress build output
        working-directory: admin-front
        run: tar -czf admin-dist-prod.tar.gz dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-build-prod
          path: admin-front/admin-dist-prod.tar.gz
          retention-days: 1

  # ========== Admin Frontend Build (Development) ==========
  build-admin-frontend-dev:
    if: ${{ github.event.inputs.target == 'all-dev' || github.event.inputs.target == 'admin-frontend-dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-front/package-lock.json

      - name: Cache Vite build
        uses: actions/cache@v4
        with:
          path: |
            admin-front/node_modules/.vite
            admin-front/node_modules/.cache
          key: vite-build-${{ runner.os }}-${{ hashFiles('admin-front/package-lock.json', 'admin-front/vite.config.ts') }}
          restore-keys: |
            vite-build-${{ runner.os }}-

      - name: Install dependencies
        working-directory: admin-front
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Vite (Development)
        working-directory: admin-front
        timeout-minutes: 10
        env:
          CI: true
          NODE_ENV: production
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build:dev

      - name: Verify build output
        working-directory: admin-front
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Build failed: dist/index.html not found"
            exit 1
          fi
          echo "Build verified successfully"
          ls -la dist/

      - name: Compress build output
        working-directory: admin-front
        run: tar -czf admin-dist-dev.tar.gz dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-build-dev
          path: admin-front/admin-dist-dev.tar.gz
          retention-days: 1

  # ========== Admin Frontend Deploy (Production) ==========
  deploy-admin-frontend-prod:
    if: ${{ always() && (github.event.inputs.target == 'all-prod' || github.event.inputs.target == 'admin-frontend-prod') }}
    runs-on: [self-hosted, sajuline]
    needs: [deploy-admin-backend-prod, build-admin-frontend-prod]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: admin-build-prod
          path: /tmp/admin-build

      - name: Deploy Admin Frontend (Production)
        run: |
          cd /data/www/new-sajuline/admin-front

          # Git pull (코드만)
          git fetch origin
          git reset --hard origin/main

          # 빌드 결과물 배포
          rm -rf dist
          tar -xzf /tmp/admin-build/admin-dist-prod.tar.gz
          rm -rf /tmp/admin-build

          echo "Admin Frontend (Production) 배포 완료"

      - name: Verify deployment
        run: |
          if [ -f "/data/www/new-sajuline/admin-front/dist/index.html" ]; then
            echo "Deployment verified successfully"
          else
            echo "Warning: dist/index.html not found"
          fi

  # ========== Admin Frontend Deploy (Development) ==========
  deploy-admin-frontend-dev:
    if: ${{ always() && (github.event.inputs.target == 'all-dev' || github.event.inputs.target == 'admin-frontend-dev') }}
    runs-on: [self-hosted, sajuline]
    needs: [deploy-admin-backend-dev, build-admin-frontend-dev]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: admin-build-dev
          path: /tmp/admin-build

      - name: Deploy Admin Frontend (Development)
        run: |
          cd /data/www/new-sajuline/admin-front

          # Git pull (코드만)
          git fetch origin
          git reset --hard origin/main

          # 빌드 결과물 배포
          rm -rf dist
          tar -xzf /tmp/admin-build/admin-dist-dev.tar.gz
          rm -rf /tmp/admin-build

          echo "Admin Frontend (Development) 배포 완료"

      - name: Verify deployment
        run: |
          if [ -f "/data/www/new-sajuline/admin-front/dist/index.html" ]; then
            echo "Deployment verified successfully"
          else
            echo "Warning: dist/index.html not found"
          fi

  # ========== Summary ==========
  summary:
    runs-on: ubuntu-latest
    needs: [deploy-admin-backend-prod, deploy-admin-backend-dev, deploy-admin-frontend-prod, deploy-admin-frontend-dev]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Admin Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Target: ${{ github.event.inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- Admin Backend Prod: ${{ needs.deploy-admin-backend-prod.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Admin Backend Dev: ${{ needs.deploy-admin-backend-dev.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Admin Frontend Prod: ${{ needs.deploy-admin-frontend-prod.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Admin Frontend Dev: ${{ needs.deploy-admin-frontend-dev.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
