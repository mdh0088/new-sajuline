name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Nuxt
        working-directory: frontend
        run: npm run build

      - name: Compress build output
        working-directory: frontend
        run: tar -czf nuxt-output.tar.gz .output

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-build
          path: frontend/nuxt-output.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, sajuline]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuxt-build
          path: /tmp/nuxt-build

      - name: Deploy Frontend
        run: |
          cd /data/www/new-sajuline/frontend

          # Git pull (코드만)
          git fetch origin
          git reset --hard origin/main

          # 빌드 결과물 배포
          rm -rf .output
          tar -xzf /tmp/nuxt-build/nuxt-output.tar.gz
          rm -rf /tmp/nuxt-build

          # PM2 재시작
          if pm2 describe nuxt-sajuline > /dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --env production
          else
              pm2 start ecosystem.config.cjs --env production
          fi
          pm2 save

      - name: Health Check
        run: |
          sleep 10
          curl -f http://localhost:3000/ || echo "Health check skipped"

      - name: Deployment Summary
        run: |
          echo "## Frontend Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Target: /data/www/new-sajuline/frontend" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
