name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run code quality checks
        working-directory: backend
        run: |
          black --check src/
          isort --check-only src/
          flake8 src/
          mypy src/

  deploy:
    needs: test
    runs-on: [self-hosted, sajuline]
    steps:
      - name: Deploy Backend
        run: |
          cd /data/www/new-sajuline/backend
          ./deploy.sh

      - name: Health Check
        run: |
          sleep 5
          curl -f http://localhost:8000/health || echo "Health check skipped"

      - name: Deployment Summary
        run: |
          echo "## Backend Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Target: /data/www/new-sajuline/backend" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
