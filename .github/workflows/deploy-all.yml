name: Deploy All (Manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: '배포 대상'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend

jobs:
  deploy-backend:
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'backend' }}
    runs-on: [self-hosted, sajuline]
    steps:
      - name: Deploy Backend
        run: |
          cd /data/www/new-sajuline/backend
          ./deploy.sh

      - name: Health Check
        run: |
          sleep 5
          curl -f http://localhost:8000/health || echo "Health check skipped"

  build-frontend:
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Nuxt
        working-directory: frontend
        timeout-minutes: 10
        env:
          CI: true
          NUXT_TELEMETRY_DISABLED: 1
        run: |
          npm run build &
          BUILD_PID=$!

          # .output/server/index.mjs 생성 대기 (최대 10분)
          for i in {1..120}; do
            if [ -f ".output/server/index.mjs" ]; then
              echo "Build complete, killing background process"
              kill $BUILD_PID 2>/dev/null || true
              exit 0
            fi
            sleep 5
          done

          echo "Build timeout"
          kill $BUILD_PID 2>/dev/null || true
          exit 1

      - name: Verify build output
        working-directory: frontend
        run: |
          if [ ! -f ".output/server/index.mjs" ]; then
            echo "Build failed: .output/server/index.mjs not found"
            exit 1
          fi
          echo "Build verified successfully"

      - name: Compress build output
        working-directory: frontend
        run: tar -czf nuxt-output.tar.gz .output

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-build
          path: frontend/nuxt-output.tar.gz
          retention-days: 1

  deploy-frontend:
    if: ${{ always() && (github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend') }}
    runs-on: [self-hosted, sajuline]
    needs: [deploy-backend, build-frontend]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuxt-build
          path: /tmp/nuxt-build

      - name: Deploy Frontend
        run: |
          cd /data/www/new-sajuline/frontend

          # Git pull (코드만)
          git fetch origin
          git reset --hard origin/main

          # 빌드 결과물 배포
          rm -rf .output
          tar -xzf /tmp/nuxt-build/nuxt-output.tar.gz
          rm -rf /tmp/nuxt-build

          # PM2 재시작
          if pm2 describe nuxt-sajuline > /dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --env production
          else
              pm2 start ecosystem.config.cjs --env production
          fi
          pm2 save

      - name: Health Check
        run: |
          sleep 10
          curl -f http://localhost:3000/ || echo "Health check skipped"

  summary:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Target: ${{ github.event.inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.deploy-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.deploy-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
