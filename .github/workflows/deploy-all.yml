name: Deploy All (Manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: '배포 대상'
        required: true
        default: 'all-prod'
        type: choice
        options:
          - all-prod
          - all-dev
          - backend-prod
          - backend-dev
          - frontend-prod
          - frontend-dev

jobs:
  # ========== Backend Production ==========
  deploy-backend-prod:
    if: ${{ github.event.inputs.target == 'all-prod' || github.event.inputs.target == 'backend-prod' }}
    runs-on: [self-hosted, sajuline]
    steps:
      - name: Deploy Backend (Production)
        run: |
          cd /data/www/new-sajuline/backend
          chmod +x deploy.production.sh
          ./deploy.production.sh

      - name: Health Check
        run: |
          sleep 5
          curl -f http://localhost:8000/health || echo "Health check skipped"

  # ========== Backend Development ==========
  deploy-backend-dev:
    if: ${{ github.event.inputs.target == 'all-dev' || github.event.inputs.target == 'backend-dev' }}
    runs-on: [self-hosted, sajuline]
    steps:
      - name: Deploy Backend (Development)
        run: |
          cd /data/www/new-sajuline/backend
          chmod +x deploy.development.sh
          ./deploy.development.sh

      - name: Health Check
        run: |
          sleep 5
          curl -f http://localhost:8000/health || echo "Health check skipped"

  # ========== Frontend Build (Production) ==========
  build-frontend-prod:
    if: ${{ github.event.inputs.target == 'all-prod' || github.event.inputs.target == 'frontend-prod' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Load environment variables
        working-directory: frontend
        run: |
          # .env.production 파일을 GitHub Actions 환경 변수로 등록
          if [ -f .env.production ]; then
            while IFS='=' read -r key value; do
              # 빈 줄, 주석, 키가 없는 라인 무시
              if [ -z "$key" ] || [[ "$key" =~ ^[[:space:]]*# ]] || [ -z "$value" ]; then
                continue
              fi
              # 공백 제거 및 따옴표 제거
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs)
              # GitHub Actions 환경 변수로 등록
              echo "$key=$value" >> $GITHUB_ENV
            done < .env.production
          fi

      - name: Build Nuxt (Production)
        working-directory: frontend
        timeout-minutes: 10
        env:
          CI: true
          NUXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: |
          npm run build &
          BUILD_PID=$!

          # .output/server/index.mjs 생성 대기 (최대 10분)
          for i in {1..120}; do
            if [ -f ".output/server/index.mjs" ]; then
              echo "Build complete, killing background process"
              kill $BUILD_PID 2>/dev/null || true
              exit 0
            fi
            sleep 5
          done

          echo "Build timeout"
          kill $BUILD_PID 2>/dev/null || true
          exit 1

      - name: Verify build output
        working-directory: frontend
        run: |
          if [ ! -f ".output/server/index.mjs" ]; then
            echo "Build failed: .output/server/index.mjs not found"
            exit 1
          fi
          echo "Build verified successfully"

      - name: Compress build output
        working-directory: frontend
        run: tar -czf nuxt-output-prod.tar.gz .output

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-build-prod
          path: frontend/nuxt-output-prod.tar.gz
          retention-days: 1

  # ========== Frontend Build (Development) ==========
  build-frontend-dev:
    if: ${{ github.event.inputs.target == 'all-dev' || github.event.inputs.target == 'frontend-dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Load environment variables
        working-directory: frontend
        run: |
          # .env.development 파일을 GitHub Actions 환경 변수로 등록
          if [ -f .env.development ]; then
            while IFS='=' read -r key value; do
              # 빈 줄, 주석, 키가 없는 라인 무시
              if [ -z "$key" ] || [[ "$key" =~ ^[[:space:]]*# ]] || [ -z "$value" ]; then
                continue
              fi
              # 공백 제거 및 따옴표 제거
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs)
              # GitHub Actions 환경 변수로 등록
              echo "$key=$value" >> $GITHUB_ENV
            done < .env.development
          fi

      - name: Build Nuxt (Development)
        working-directory: frontend
        timeout-minutes: 10
        env:
          CI: true
          NUXT_TELEMETRY_DISABLED: 1
          NODE_ENV: development
        run: |
          npm run build &
          BUILD_PID=$!

          # .output/server/index.mjs 생성 대기 (최대 10분)
          for i in {1..120}; do
            if [ -f ".output/server/index.mjs" ]; then
              echo "Build complete, killing background process"
              kill $BUILD_PID 2>/dev/null || true
              exit 0
            fi
            sleep 5
          done

          echo "Build timeout"
          kill $BUILD_PID 2>/dev/null || true
          exit 1

      - name: Verify build output
        working-directory: frontend
        run: |
          if [ ! -f ".output/server/index.mjs" ]; then
            echo "Build failed: .output/server/index.mjs not found"
            exit 1
          fi
          echo "Build verified successfully"

      - name: Compress build output
        working-directory: frontend
        run: tar -czf nuxt-output-dev.tar.gz .output

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-build-dev
          path: frontend/nuxt-output-dev.tar.gz
          retention-days: 1

  # ========== Frontend Deploy (Production) ==========
  deploy-frontend-prod:
    if: ${{ always() && (github.event.inputs.target == 'all-prod' || github.event.inputs.target == 'frontend-prod') }}
    runs-on: [self-hosted, sajuline]
    needs: [deploy-backend-prod, build-frontend-prod]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuxt-build-prod
          path: /tmp/nuxt-build

      - name: Deploy Frontend (Production)
        run: |
          cd /data/www/new-sajuline/frontend

          # Git pull (코드만)
          git fetch origin
          git reset --hard origin/main

          # 빌드 결과물 배포
          rm -rf .output
          tar -xzf /tmp/nuxt-build/nuxt-output-prod.tar.gz
          rm -rf /tmp/nuxt-build

          # PM2 재시작 (Production)
          if pm2 describe nuxt-sajuline > /dev/null 2>&1; then
              pm2 delete nuxt-sajuline
          fi
          pm2 start ecosystem.production.config.cjs
          pm2 save

      - name: Health Check
        run: |
          sleep 10
          curl -f http://localhost:3000/ || echo "Health check skipped"

  # ========== Frontend Deploy (Development) ==========
  deploy-frontend-dev:
    if: ${{ always() && (github.event.inputs.target == 'all-dev' || github.event.inputs.target == 'frontend-dev') }}
    runs-on: [self-hosted, sajuline]
    needs: [deploy-backend-dev, build-frontend-dev]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuxt-build-dev
          path: /tmp/nuxt-build

      - name: Deploy Frontend (Development)
        run: |
          cd /data/www/new-sajuline/frontend

          # Git pull (코드만)
          git fetch origin
          git reset --hard origin/main

          # 빌드 결과물 배포
          rm -rf .output
          tar -xzf /tmp/nuxt-build/nuxt-output-dev.tar.gz
          rm -rf /tmp/nuxt-build

          # PM2 재시작 (Development)
          if pm2 describe nuxt-sajuline > /dev/null 2>&1; then
              pm2 delete nuxt-sajuline
          fi
          pm2 start ecosystem.development.config.cjs
          pm2 save

      - name: Health Check
        run: |
          sleep 10
          curl -f http://localhost:3000/ || echo "Health check skipped"

  # ========== Summary ==========
  summary:
    runs-on: ubuntu-latest
    needs: [deploy-backend-prod, deploy-backend-dev, deploy-frontend-prod, deploy-frontend-dev]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Target: ${{ github.event.inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Prod: ${{ needs.deploy-backend-prod.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Dev: ${{ needs.deploy-backend-dev.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Prod: ${{ needs.deploy-frontend-prod.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Dev: ${{ needs.deploy-frontend-dev.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
