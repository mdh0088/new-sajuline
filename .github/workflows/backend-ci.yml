name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run code formatting check
      working-directory: backend
      run: |
        echo "🎨 Checking code formatting..."
        black --check src/ tests/
        isort --check-only src/ tests/

    - name: Run linting
      working-directory: backend  
      run: |
        echo "🔍 Running linting..."
        flake8 src/ tests/

    - name: Run type checking
      working-directory: backend
      run: |
        echo "📝 Running type checking..."
        mypy src/

    - name: Run unit tests
      working-directory: backend
      run: |
        echo "🧪 Running unit tests..."
        pytest tests/unit/ -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.python-version == 3.11
      with:
        file: backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

    - name: Test summary
      if: always()
      run: |
        echo "## 🎯 Backend CI Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Code formatting: Black, isort" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Linting: Flake8" >> $GITHUB_STEP_SUMMARY  
        echo "- ✅ Type checking: mypy" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Unit tests: pytest with coverage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🚀 Ready for code review!" >> $GITHUB_STEP_SUMMARY

